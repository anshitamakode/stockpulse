# Optional, git-ignored file next to pom.xml holding llm.api-key=... (see README)
spring.config.import=optional:file:./local.properties
spring.application.name=stockpulse
server.port=8080

# ---------- H2 (in-memory, recreated on every start) ----------
spring.datasource.url=jdbc:h2:mem:stockpulse;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Commerce engine ----------
# Active strategy at startup: ai | ruleBased  (switchable at runtime via PATCH /strategy)
stockpulse.strategy=${STOCKPULSE_STRATEGY:ai}
stockpulse.demand.window-minutes=10
stockpulse.demand.spike-min-units=5
stockpulse.demand.spike-ratio=1.3
stockpulse.pricing.max-change-pct=20
stockpulse.pricing.min-price=1.00
stockpulse.reorder.lead-time-days=7
stockpulse.reorder.cover-days=14
stockpulse.reorder.case-pack=5
stockpulse.reorder.max-quantity=2000

# ---------- LLM (see LLMGateway for provider details) ----------
# provider: gemini | groq | ollama | openai (any OpenAI-compatible endpoint, e.g. LiteLLM)
llm.provider=${LLM_PROVIDER:gemini}
llm.api-key=${LLM_API_KEY:${LITELLM_API_KEY:}}
llm.model=${LLM_MODEL:gemini-3.5-flash-lite}
# Tried in order when the primary model is down, overloaded or retired
llm.fallback-models=${LLM_FALLBACK_MODELS:gemini-3.1-flash-lite}
llm.base-url=${LLM_BASE_URL:https://generativelanguage.googleapis.com}
llm.temperature=0.2
llm.max-tokens=4096
# Extra attempts per model on timeouts, 429 and 5xx, with linear backoff
llm.retries=1
llm.retry-backoff-ms=750
llm.connect-timeout-ms=5000
llm.timeout-ms=15000

# ---------- Recovery of suggestions stuck in PROCESSING ----------
stockpulse.recovery.stale-after-seconds=120
stockpulse.recovery.give-up-after-seconds=600
stockpulse.recovery.sweep-interval-ms=60000

logging.level.com.stockpulse=INFO
